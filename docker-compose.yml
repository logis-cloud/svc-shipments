version: '3.8'

services:
  ms-envios:
    build: .
    container_name: ms-envios
    restart: unless-stopped
    env_file:
      - .env
    # Solo necesario para pruebas en local en Linux, donde MONGODB_URI /
    # CLIENTES_SERVICE_URL / VEHICULOS_SERVICE_URL apuntan a
    # host.docker.internal. En producción (VM de prod) las URLs de .env
    # apuntan a la IP privada de la VM3 (bases de datos) y a las IPs/DNS
    # de los otros dos microservicios, así que este extra_hosts es inofensivo.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8003:8080"
